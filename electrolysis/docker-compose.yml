services:
  database:
    image: postgres:18-alpine
    env_file:
      - ./env/database.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: no
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - database
    env_file:
      - ./env/pgadmin.env

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
  postgres_data: